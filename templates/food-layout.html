<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <link rel="canonical" href="https://emmettredding.com{{url}}">
  <link rel="stylesheet" href="/food/food-style.css">
  <link rel="icon" href="/favicon.png" type="image/png">
  <script src="/assets/legacy-routes.js"></script>

<body>

    <p class="masthead-meta">Est. 2026 &nbsp;&middot;&nbsp; Melbourne, Australia</p>

  </header>

  <!-- NAV -->
  <nav class="site-nav">
    <a href="/food/">Home</a>
    <span class="nav-separator">&bull;</span>
    <a href="/food/?reviews">Reviews</a>

  </nav>

<main>
{{content}}
</main>
  <!-- FOOTER -->
  <footer class="site-footer">
    <p class="footer-name">The Considered Palate</p>
    <p class="footer-text">Melbourne &nbsp;&middot;&nbsp; 2026</p>
